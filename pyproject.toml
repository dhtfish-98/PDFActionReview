[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-action-review"
version = "0.1.4"
description = "Bounded read-only contextual PDF name and structural token review"
readme = "项目文档/README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["项目文档/LICENSE"]
authors = [{name = "dhtfish98"}]
dependencies = []

[project.scripts]
pdf-action-review = "pdf_action_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/pdf-action-review" = ["项目文档/ORIGIN.md", "项目文档/DEFENSIVE_SCOPE.md", "项目文档/VALIDATION.md"]
